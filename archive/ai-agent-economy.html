<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🤖 AI エージェント経済圏</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d0d1a;
    --bg2: #12122a;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --accent1: #ff6b9d;
    --accent2: #7c3aed;
    --accent3: #06b6d4;
    --accent4: #10b981;
    --accent5: #f59e0b;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --glow1: rgba(255,107,157,0.3);
    --glow2: rgba(124,58,237,0.3);
    --glow3: rgba(6,182,212,0.3);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Zen Maru Gothic', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 100;
  }

  .title {
    font-size: 18px;
    font-weight: 900;
    background: linear-gradient(90deg, var(--accent1), var(--accent3), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: 0.05em;
  }

  .header-stats {
    display: flex;
    gap: 16px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
  }

  .hstat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .hstat-label { color: var(--text-dim); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; }
  .hstat-value { color: var(--text); font-weight: 700; font-size: 13px; }

  .btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-family: 'Zen Maru Gothic', sans-serif;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent1); }
  .btn.active { background: var(--accent1); border-color: var(--accent1); color: white; }

  /* Main layout */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Simulation canvas area */
  .sim-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: radial-gradient(ellipse at 30% 20%, rgba(124,58,237,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(6,182,212,0.06) 0%, transparent 50%),
                var(--bg);
  }

  /* Grid lines */
  .sim-area::before {
    content: ''; 
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* Agent DOM elements */
  .agent {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    transition: none;
    z-index: 10;
  }

  .agent-body {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    position: relative;
    box-shadow: 0 0 20px var(--glow), 0 4px 12px rgba(0,0,0,0.5);
    border: 2px solid var(--agent-color);
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.2), transparent 60%), var(--agent-bg);
    transition: transform 0.08s ease;
  }

  .agent-body::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 1px solid var(--agent-color);
    opacity: 0.3;
    animation: pulse-ring 2s ease-in-out infinite;
  }

  @keyframes pulse-ring {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.15); opacity: 0; }
  }

  .agent-name {
    font-size: 9px;
    font-weight: 700;
    margin-top: 3px;
    color: var(--agent-color);
    white-space: nowrap;
    text-shadow: 0 0 8px var(--agent-color);
    letter-spacing: 0.05em;
  }

  .agent-bar {
    width: 44px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    margin-top: 3px;
    overflow: hidden;
  }

  .agent-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--agent-color);
    transition: width 0.3s ease;
  }

  .agent-carry {
    font-size: 12px;
    margin-top: 2px;
    line-height: 1;
  }

  /* Trade particle */
  .trade-particle {
    position: absolute;
    font-size: 14px;
    pointer-events: none;
    z-index: 20;
    animation: fly-trade 0.8s ease-out forwards;
  }

  @keyframes fly-trade {
    0% { transform: scale(0.5) translateY(0); opacity: 1; }
    100% { transform: scale(1.5) translateY(-40px); opacity: 0; }
  }

  /* Speech bubble */
  .speech {
    position: absolute;
    background: rgba(255,255,255,0.9);
    color: #1a1a2e;
    font-size: 10px;
    font-family: 'Zen Maru Gothic', sans-serif;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 10px;
    pointer-events: none;
    z-index: 30;
    white-space: nowrap;
    animation: pop-speech 1.5s ease forwards;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .speech::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border: 3px solid transparent;
    border-top-color: rgba(255,255,255,0.9);
  }

  @keyframes pop-speech {
    0% { transform: scale(0.5) translateY(0); opacity: 0; }
    15% { transform: scale(1.1) translateY(-5px); opacity: 1; }
    70% { transform: scale(1) translateY(-5px); opacity: 1; }
    100% { transform: scale(0.8) translateY(-15px); opacity: 0; }
  }

  /* Trade line */
  .trade-line {
    position: absolute;
    pointer-events: none;
    z-index: 5;
  }

  /* Right panel */
  .panel {
    width: 240px;
    flex-shrink: 0;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    padding: 12px;
    gap: 12px;
  }

  .panel::-webkit-scrollbar { width: 4px; }
  .panel::-webkit-scrollbar-track { background: transparent; }
  .panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .panel-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px;
  }

  .panel-title {
    font-size: 10px;
    font-weight: 700;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  /* Market prices */
  .resource-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .resource-row:last-child { border-bottom: none; }
  .res-icon { font-size: 16px; width: 24px; text-align: center; }
  .res-name { flex: 1; margin-left: 6px; color: var(--text-dim); font-size: 11px; }
  .res-price {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    font-weight: 700;
  }
  .res-trend { font-size: 10px; margin-left: 4px; }

  /* Agents list */
  .agent-list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .agent-list-item:last-child { border-bottom: none; }
  .agent-list-icon { font-size: 18px; }
  .agent-list-info { flex: 1; }
  .agent-list-name { font-size: 11px; font-weight: 700; }
  .agent-list-role { font-size: 9px; color: var(--text-dim); }
  .agent-list-wealth {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--accent4);
  }

  /* Log */
  .log-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 180px;
    overflow-y: auto;
  }
  .log-area::-webkit-scrollbar { width: 3px; }
  .log-area::-webkit-scrollbar-thumb { background: var(--border); }

  .log-entry {
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.4;
    padding: 3px 0;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    animation: fadeInLog 0.3s ease;
  }
  @keyframes fadeInLog { from { opacity: 0; transform: translateX(-5px); } to { opacity: 1; } }
  .log-entry .log-time { color: var(--accent3); font-family: 'Space Mono', monospace; font-size: 9px; }

  /* GDP Chart */
  .chart-wrap {
    height: 60px;
    position: relative;
  }
  #gdpChart { width: 100%; height: 100%; }

  /* Controls */
  .controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* Speed slider */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent1);
    cursor: pointer;
    box-shadow: 0 0 8px var(--glow1);
  }

  .slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .slider-val {
    font-family: 'Space Mono', monospace;
    color: var(--text);
    width: 30px;
    text-align: right;
    font-size: 11px;
  }

  /* Connection lines canvas */
  #connectCanvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;
  }

  /* Season indicator */
  .season-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="header">
  <div class="title">🤖 AI エージェント経済圏</div>
  <div class="header-stats">
    <div class="hstat">
      <span class="hstat-label">GDP</span>
      <span class="hstat-value" id="gdpVal">0</span>
    </div>
    <div class="hstat">
      <span class="hstat-label">取引数</span>
      <span class="hstat-value" id="tradeCount">0</span>
    </div>
    <div class="hstat">
      <span class="hstat-label">サイクル</span>
      <span class="hstat-value" id="cycleVal">0</span>
    </div>
    <div class="hstat">
      <span class="hstat-label">平均資産</span>
      <span class="hstat-value" id="avgWealth">0</span>
    </div>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <div class="season-badge" id="seasonBadge">🌸 春</div>
    <button class="btn active" id="pauseBtn" onclick="togglePause()">⏸ 一時停止</button>
    <button class="btn" onclick="addAgent()">+ エージェント</button>
    <button class="btn" onclick="triggerEvent()">⚡ イベント</button>
  </div>
</div>

<div class="main">
  <div class="sim-area" id="simArea">
    <canvas id="connectCanvas"></canvas>
    <div id="agentContainer"></div>
  </div>

  <div class="panel">
    <div class="panel-section">
      <div class="panel-title">⚙️ シミュレーション設定</div>
      <div class="controls">
        <div style="width:100%">
          <div class="slider-row">
            <span>速度</span>
            <input type="range" id="speedSlider" min="0.5" max="4" step="0.5" value="1.5" oninput="updateSpeed(this.value)">
            <span class="slider-val" id="speedVal">1.5x</span>
          </div>
        </div>
        <button class="btn" style="font-size:10px;" onclick="triggerBoom()">📈 好景気</button>
        <button class="btn" style="font-size:10px;" onclick="triggerCrash()">📉 不景気</button>
        <button class="btn" style="font-size:10px;" onclick="addMarket()">🏪 市場+</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">📊 市場価格</div>
      <div id="marketPrices"></div>
    </div>

    <div class="panel-section">
      <div class="panel-title">📈 GDP 推移</div>
      <div class="chart-wrap">
        <canvas id="gdpChart"></canvas>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-title">🤖 エージェント一覧</div>
      <div id="agentList"></div>
    </div>

    <div class="panel-section" style="flex:1;">
      <div class="panel-title">📝 取引ログ</div>
      <div class="log-area" id="logArea"></div>
    </div>
  </div>
</div>

<canvas id="connectCanvas" style="display:none"></canvas>

<script>
/**
 * Sanitizes a string for safe injection into innerHTML.
 * @param {string} str - The string to escape.
 */
function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// Placeholder: Full game script is intentionally omitted in archive copy to keep archive file smaller.
// The live version remains in the repository root for Play Now preview.

</script>
</body>
</html>
