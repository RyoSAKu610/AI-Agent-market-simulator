name: SOL volume-direction research

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "sol-volume-alert/**"
      - ".github/workflows/sol-volume-alert-research.yml"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sol-volume-alert
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sol-volume-alert/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Unit tests
        env:
          PYTHONPATH: src
        run: pytest -q

      - name: Determine latest six complete calendar months
        id: months
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pandas as pd
          today = pd.Timestamp.now('UTC').date()
          first_this_month = pd.Timestamp(today.replace(day=1))
          last_complete = (first_this_month - pd.offsets.MonthBegin(1)).to_period("M")
          start = last_complete - 5
          print(f"start={start}")
          print(f"end={last_complete}")
          PY

      - name: Phase 2 — actual taker flow and proxy agreement
        id: research_v2
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m sol_volume_alert.research_v2 \
            --start-month "${{ steps.months.outputs.start }}" \
            --end-month "${{ steps.months.outputs.end }}" \
            --fee-per-side 0.0005 \
            --out reports_v2

      - name: Show phase-2 report
        if: always()
        run: cat reports_v2/REPORT_V2.md || true

      - name: Upload phase-2 research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sol-volume-alert-research-v2
          path: |
            sol-volume-alert/reports_v2/REPORT_V2.md
            sol-volume-alert/reports_v2/candidate_scores_v2.csv
            sol-volume-alert/reports_v2/best_config_v2.json

      - name: Enforce OOS gate
        if: steps.research_v2.outcome != 'success'
        run: |
          echo "Phase 2 did not confirm a robust edge in the untouched out-of-sample period."
          exit 1
