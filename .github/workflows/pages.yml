name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify experience layer
        run: |
          python3 -m py_compile scripts/apply-offline-actions.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check neon-mythos-experience.js
          node --check sw.js

      - name: Stage site
        run: |
          mkdir -p _site
          # Copy everything except VCS/CI metadata and the local Claude config.
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude '.claude' \
                   --exclude '_site' \
                   ./ _site/
          # Serve the site raw — no Jekyll processing.
          touch _site/.nojekyll
          ls -la _site

      - name: Inject offline long-term actions
        run: python3 scripts/apply-offline-actions.py _site/index.html

      - name: Verify staged integration
        run: |
          grep -q 'manifest.webmanifest' _site/index.html
          grep -q 'neon-mythos-experience.js' _site/index.html
          grep -q 'nm:ltt-command' _site/index.html
          grep -q 'nm:create-companion' _site/index.html
          grep -q 'nm:ltt-event' _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
