name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify experience layer
        run: |
          python3 -m py_compile scripts/apply-offline-actions.py scripts/apply-errand-mode.py scripts/apply-route-fx.py
          python3 -m json.tool manifest.webmanifest >/dev/null
          node --check neon-mythos-experience.js
          node --check neon-mythos-errand.js
          node --check neon-mythos-route-fx.js
          node --check sw.js

      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude '.claude' \
                   --exclude '_site' \
                   ./ _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Inject offline long-term actions
        run: python3 scripts/apply-offline-actions.py _site/index.html

      - name: Wire AI errand mode
        run: python3 scripts/apply-errand-mode.py _site/index.html _site/neon-mythos-experience.js

      - name: Wire head reactions and neon route FX
        run: python3 scripts/apply-route-fx.py _site/index.html

      - name: Verify staged integration
        run: |
          node --check _site/neon-mythos-experience.js
          node --check _site/neon-mythos-errand.js
          node --check _site/neon-mythos-route-fx.js
          grep -q 'manifest.webmanifest' _site/index.html
          grep -q 'neon-mythos-experience.js' _site/index.html
          grep -q 'neon-mythos-errand.js' _site/index.html
          grep -q 'neon-mythos-route-fx.js' _site/index.html
          grep -q 'data-agent-id' _site/index.html
          grep -q 'nm:ltt-command' _site/index.html
          grep -q 'nm:create-companion' _site/index.html
          grep -q 'nm:ltt-event' _site/index.html
          grep -q 'nm:route-agent' _site/index.html
          grep -q 'nm:agent-routed' _site/index.html
          grep -q 'fromX: agent.x' _site/index.html
          grep -q 'tile: TILE' _site/index.html
          grep -q 'nm:errand-request' _site/neon-mythos-experience.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
